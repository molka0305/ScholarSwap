<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié - ScholarSwap</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0A1E4A;   
            --primary-blue: #5BCAF4;    
            --bg-light: #f8f9fa;        
            --border-color: #e0e0e0;
            --text-gray: #6B7280;
            --success-green: #10B981;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-container img {
            height: 80px;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 22px;
        }
        p.subtitle {
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-dark);
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--primary-blue);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .link-alt {
            display: block;
            margin-top: 20px;
            font-size: 14px;
            color: var(--primary-blue);
            text-decoration: none;
        }
        .link-alt:hover { text-decoration: underline; }

        /* Styles pour le message de succès */
        #success-message {
            display: none; /* Caché par défaut */
            animation: fadeIn 0.5s ease-in-out;
        }
        .success-icon {
            color: var(--success-green);
            font-size: 50px;
            margin-bottom: 15px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-container">
            <img src="assets/colored-logo1.png" alt="Logo">
        </div>

        <div id="forgot-password-content">
            <h2>Mot de passe oublié</h2>
            <p class="subtitle">Entrez votre email pour recevoir un lien de récupération</p>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label>Email étudiant</label>
                    <input type="email" id="userEmail" placeholder="nom@etudiant.com" required>
                </div>
                <button type="submit" class="btn-primary">Envoyer le lien</button>
            </form>
        </div>

        <div id="success-message">
            <div class="success-icon">✓</div>
            <h2>Lien envoyé !</h2>
            <p class="subtitle">Un email de récupération a été envoyé à l'adresse indiquée. Pensez à vérifier vos spams.</p>
        </div>
        
        <a href="login.html" class="link-alt">Retour à la connexion</a>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Empêche le rechargement de la page
            
            // On cache le contenu du formulaire
            document.getElementById('forgot-password-content').style.display = 'none';
            
            // On affiche le message de succès
            document.getElementById('success-message').style.display = 'block';
        });
    </script>
</body>
</html>
