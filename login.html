<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - ScholarSwap</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0A1E4A;
            --primary-blue: #5BCAF4;
            --bg-light: #f8f9fa;
            --border-color: #e0e0e0;
            --text-gray: #6B7280;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            height: 80px;
            margin-bottom: 20px;
        }
        h2 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 22px;
        }
        p.subtitle {
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-dark);
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--primary-blue);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .login-footer {
            margin-top: 25px;
            font-size: 13px;
        }
        .login-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }
        .login-footer span {
            display: block;
            margin-top: 10px;
            color: var(--text-gray);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="assets/colored-logo1.png" alt="Logo ScholarSwap" class="login-logo">
        <h2>Bienvenue sur ScholarSwap</h2>
        <p class="subtitle">Connectez-vous pour accéder à vos ressources</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email étudiant</label>
                <input type="email" id="email" placeholder="nom@etudiant.com" required>
            </div>
            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Se connecter</button>
        </form>

        <div class="login-footer">
            <a href="forgot_password.html">Mot de passe oublié ?</a>
            <span>Pas encore de compte ? <a href="register.html">S'inscrire</a></span>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Empêche l'envoi classique du formulaire
            
            // Ici, tu pourrais ajouter une petite animation de chargement sur le bouton
            const btn = document.querySelector('.login-btn');
            btn.innerText = "Connexion en cours...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            // Simulation d'une vérification de 1 seconde avant redirection
            setTimeout(function() {
                // Redirection vers ta page d'accueil (à adapter selon le nom de ton fichier)
                window.location.href = "home.html"; 
            }, 1000);
        });
    </script>
</body>
</html>
