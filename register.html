<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - ScholarSwap</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #0A1E4A;
            --primary-blue: #5BCAF4;
            --bg-light: #f8f9fa;
            --border-color: #e0e0e0;
            --text-gray: #6B7280;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-container img { 
            width: 150px; 
            height: auto; 
            margin-bottom: 20px; 
        }
        h2 { font-family: 'Montserrat', sans-serif; color: var(--primary-dark); margin-bottom: 10px; font-size: 22px; }
        .subtitle { color: var(--text-gray); font-size: 14px; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; color: var(--primary-dark); }
        input { 
            width: 100%; padding: 12px; border: 1px solid var(--border-color); 
            border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary-blue); }
        .btn-primary { 
            width: 100%; padding: 14px; background: var(--primary-dark); 
            color: white; border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; margin-top: 10px; font-size: 16px;
        }
        .footer-link { margin-top: 20px; font-size: 14px; color: var(--text-gray); }
        .footer-link a { color: var(--primary-blue); font-weight: bold; text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-container">
            <img src="assets/colored-logo1.png" alt="Logo ScholarSwap">
        </div>
        <h2>Créer un compte</h2>
        <p class="subtitle">Rejoignez la communauté ScholarSwap</p>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" placeholder="Molka ..." required>
            </div>
            <div class="form-group">
                <label>Email étudiant</label>
                <input type="email" placeholder="nom@etudiant.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">S'inscrire</button>
        </form>

        <div class="footer-link">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Empêche le rechargement de la page
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Création du compte...";
            btn.disabled = true;
            btn.style.opacity = "0.7";

            // Simulation d'un délai de traitement
            setTimeout(function() {
                // Redirection vers ta page de succès d'inscription
                window.location.href = "success.html"; 
            }, 1500);
        });
    </script>
</body>
</html>
