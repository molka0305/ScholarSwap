<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rejoindre - ScholarSwap</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/groupes.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="header-left">
            <a href="index.html">
                <img src="assets/colored-logo2.png" alt="Logo ScholarSwap" class="nav-logo">
            </a>
        </div>
        <div class="search-container">
            <input type="text" placeholder="Rechercher un groupe (ex: JavaScript)...">
        </div>
        <div class="header-right">
            <div class="user-badge" onclick="window.location.href='profil.html'" style="cursor: pointer;">Etudiant</div>
        </div>
    </header>

    <div class="main-layout">
        <nav class="sidebar">
            <ul>
                <li onclick="window.location.href='index.html'"><span class="icon">🏠</span> Accueil</li>
                <li onclick="window.location.href='matieres.html'"><span class="icon">📚</span> Mes Matières</li>
                <li onclick="window.location.href='quiz.html'"><span class="icon">📝</span> Mes Quiz</li>
                <li class="active" onclick="window.location.href='groupes.html'"><span class="icon">👥</span> Groupes d'étude</li>
                <hr style="border: 0; border-top: 1px solid #EEE; margin: 15px 0;">
                <li onclick="window.location.href='parametres.html'"><span class="icon">⚙️</span> Paramètres</li>
            </ul>
        </nav>

        <main class="feed">
            <div class="group-card" style="max-width: 500px; margin: auto; text-align: center;">
                <h2 style="font-family: Montserrat;">Demande envoyée !</h2>
                <p style="margin: 20px 0;">Vous avez envoyé une demande pour rejoindre <strong>Entraide JavaScript</strong>. Vous recevrez une notification quand l'admin acceptera.</p>
                <button class="create-group-btn" onclick="window.location.href='groupes.html'">Retour aux groupes</button>
            </div>
        </main>
    </div>
</body>
</html>
