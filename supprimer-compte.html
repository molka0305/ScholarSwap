<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer le compte</title>

    <link rel="stylesheet" href="css/supprimer-compte.css">
</head>

<body>

    <div class="delete-container">

        <h1>⚠️ Supprimer le compte</h1>

        <p>
            Cette action est irréversible.
            Toutes vos données seront supprimées définitivement.
        </p>

        <input type="password"
               placeholder="Entrez votre mot de passe">

        <div class="actions">

            <button class="cancel-btn"
                    onclick="window.location.href='parametres.html'">

                Annuler

            </button>

            <button class="delete-btn"
                    onclick="supprimerCompte()">

                Supprimer définitivement

            </button>

        </div>

    </div>

    <script src="js/supprimer-compte.js"></script>

</body>

</html>
